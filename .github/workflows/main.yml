name: Deploy Svelte App to GitHub Pages

on:
  push:
    branches: ["claude/cardiac-cascade-simulator-9OwAT"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install adapter-static
        run: npm install -D @sveltejs/adapter-static

      - name: Update svelte.config.js for static adapter
        run: |
          cat > svelte.config.js << 'EOF'
          import adapter from '@sveltejs/adapter-static';

          /** @type {import('@sveltejs/kit').Config} */
          const config = {
            kit: {
              adapter: adapter({
                pages: 'build',
                assets: 'build',
                fallback: 'index.html',
                precompress: false,
                strict: true
              }),
              paths: {
                base: '/cardio-sim'
              }
            }
          };

          export default config;
          EOF

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    environment:
      name: github-pages
      url: ${{ github.pages.url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
